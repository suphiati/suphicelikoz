<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>og-cover</title>

<!--
  Sosyal paylasim kapagi (1200x630). Bu sayfa siteye bagli degildir; yalnizca
  "node tools/build-og-cover.js" onu 1200x630 goruntu alip
  assets/img/og-cover.jpg olarak kaydetmek icin acar.

  Renkler assets/css/style.css icindeki :root degiskenlerinin birebir
  kopyasidir. Stil dosyasini disaridan baglamiyoruz cunku o dosya
  "@media print" ve mobil sorgular tasiyor; 1200x630'luk bir tuvalde
  ikisi de yanlis yerlerde devreye girer.
  Paleti degistirirsen iki dosyayi birlikte guncelle.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #0b1120;
    --surface:   #111a2e;
    --border:    rgba(255, 255, 255, .09);
    --text:      #e6ecf7;
    --text-soft: #b3c0d6;
    --muted:     #8a9ab5;
    --brand:     #2e7dff;
    --cyan:      #22d3ee;
    --grad-text: linear-gradient(120deg, #ffffff 0%, #a9c8ff 46%, #22d3ee 100%);
    --ff-sans: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    --ff-head: "Space Grotesk", var(--ff-sans);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ff-sans);
    /* Chrome'un kendi yumusatmasi 1x olcekte metni inceltiyor; kapak
       kucuk onizlemede gosterilecegi icin dolgun kalmasi daha iyi. */
    -webkit-font-smoothing: antialiased;
  }

  /* Ust kenardaki marka seridi */
  .edge {
    position: absolute;
    inset: 0 0 auto 0;
    height: 6px;
    background: linear-gradient(90deg, #2e7dff 0%, #22d3ee 100%);
  }

  .sheet {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 300px;
    align-items: center;
    gap: 56px;
    height: 100%;
    padding: 64px 72px 58px;
  }

  h1 {
    margin-top: 26px;
    font-family: var(--ff-head);
    font-size: 68px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -.02em;
  }
  h1 .sur {
    display: block;
    background: var(--grad-text);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lead {
    max-width: 640px;
    margin-top: 24px;
    font-size: 25px;
    line-height: 1.45;
    color: var(--text-soft);
  }

  .products {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 34px;
    list-style: none;
  }
  .products li {
    padding: 10px 18px;
    font-size: 19px;
    font-weight: 600;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }

  /* --- Portre --------------------------------------------------------
     Kaynak dosya 215x265 px. Burada 268x330 gosteriliyor (1,25x): daha
     fazla buyutmek bulaniklastiriyor, sitedeki hero ile ayni gerekce
     (bkz. README, "Fotografin"). */
  .side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }
  .shot {
    position: relative;
    width: 268px;
    height: 330px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .9);
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .site {
    font-family: var(--ff-head);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--text-soft);
  }
</style>
</head>

<body>
<span class="edge"></span>

<div class="sheet">
  <div>
    <h1><span>Suphi Atılım</span><span class="sur">ÇELİKÖZ</span></h1>

    <p class="lead">
      Tehlikeli madde ve lojistik alanındaki saha deneyimimi
      yazılıma taşıyorum.
    </p>

    <ul class="products">
      <li>TMGD Asistanı</li>
      <li>SafeCargo</li>
      <li>Hafıza Tutucum</li>
    </ul>
  </div>

  <div class="side">
    <div class="shot">
      <img src="/assets/img/suphifoto.png" alt="Suphi Atılım ÇELİKÖZ">
    </div>
    <span class="site">suphicelikoz.com</span>
  </div>
</div>

<script>
/*
  Tek sablon, iki dil. "?lang=en" ile acildiginda metin Ingilizceye cevrilir;
  duzen, palet ve olculer ayni kalir.

  Metin sitedeki tanitimla uyumlu olmali (content/profile.js -> intro) ve
  .products ana sayfada one cikan projelerle ayni kalmali
  (content/projects.js -> featured). Birini degistirirsen otekini de guncelle.
*/
(function () {
  if (new URLSearchParams(location.search).get("lang") !== "en") return;
  document.documentElement.lang = "en";
  document.querySelector(".lead").textContent =
    "I bring my field experience in dangerous goods and logistics into software.";
  /* Urun adlari ozel isim; iki dilde ayni. .site da ayni kalir. */
})();
</script>
</body>
</html>
